<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SynapseIDS — live flow classification</title>
<style>
  :root {
    --bg: #0b1f28; --panel: #0f2b37; --panel2: #10323f; --edge: #1c4a5c;
    --ink: #dfeef3; --dim: #7fa6b4; --accent: #35c1d6;
    --normal: #4a6b78; --scan: #ffb454; --dos: #ff5c6c; --brute: #ff8f40;
    --c2: #c586ff; --web: #ff79c6; --suspicious: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border-bottom: 1px solid var(--edge);
  }
  header .mark { font-weight: 700; letter-spacing: .5px; font-size: 15px; }
  header .mark b { color: var(--accent); }
  header .stat { color: var(--dim); }
  header .stat b { color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  button, select, input {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--edge);
    border-radius: 6px; padding: 5px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #04222a; border-color: var(--accent); font-weight: 700; }
  main { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; background: var(--panel); color: var(--dim);
    text-align: left; font-weight: 600; padding: 6px 12px; border-bottom: 1px solid var(--edge);
  }
  tbody td { padding: 4px 12px; border-bottom: 1px solid rgba(28,74,92,.4); white-space: nowrap; }
  tbody tr:hover { background: rgba(53,193,214,.06); }
  .cls { font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #04222a; }
  .cls.normal { background: var(--normal); color: var(--ink); }
  .cls.scan { background: var(--scan); }
  .cls.dos_ddos { background: var(--dos); }
  .cls.brute_force { background: var(--brute); }
  .cls.botnet_c2 { background: var(--c2); }
  .cls.web_attack { background: var(--web); }
  .cls.suspicious { background: var(--suspicious); }
  tr.lowconf td { opacity: .72; }
  tr.disagree td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; }
  .dim { color: var(--dim); }
  footer {
    padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--edge);
    color: var(--dim); display: flex; gap: 16px; align-items: center;
  }
  footer .thugs { margin-left: auto; letter-spacing: 1px; }
</style>
</head>
<body>
<header>
  <span class="mark">Synapse<b>&#9642;</b>IDS</span>
  <span class="stat">flows <b id="s-flows">0</b></span>
  <span class="stat">classified <b id="s-cls">0</b></span>
  <span class="stat">clients <b id="s-clients">0</b></span>
  <span class="stat" id="s-conn">connecting&#8230;</span>
  <span class="spacer"></span>
  <label class="dim">min&nbsp;conf
    <input id="minconf" type="number" min="0" max="100" value="0" step="5" style="width:64px" />
  </label>
  <select id="clsfilter">
    <option value="">all classes</option>
    <option>normal</option><option>scan</option><option>dos_ddos</option>
    <option>brute_force</option><option>botnet_c2</option><option>web_attack</option><option>suspicious</option>
  </select>
  <button id="pause">Pause</button>
  <button id="clear">Clear</button>
</header>

<main id="scroller">
  <table>
    <thead>
      <tr><th>time</th><th>sensor</th><th>source</th><th></th><th>destination</th><th>proto</th><th>class</th><th>confidence</th><th>models</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<footer>
  <span>replay:</span>
  <input id="rpath" placeholder="/path/to/capture.pcap" style="width:280px" />
  <select id="rspeed"><option>1</option><option>0.5</option><option>2</option><option>10</option><option value="max">max</option></select>
  <button id="rstart">Start</button>
  <button id="rstop">Stop</button>
  <span id="rstat" class="dim"></span>
  <span class="thugs">&#10214;THUGS&#10215; &#183; (c) 2026</span>
</footer>

<script>
(() => {
  const MAX_ROWS = 2000;
  const rows = document.getElementById('rows');
  const scroller = document.getElementById('scroller');
  let paused = false, pending = [];

  const $ = id => document.getElementById(id);
  $('pause').onclick = () => {
    paused = !paused;
    $('pause').textContent = paused ? 'Resume' : 'Pause';
    $('pause').classList.toggle('on', paused);
    if (!paused) { pending.forEach(addRow); pending = []; trim(); scroller.scrollTop = scroller.scrollHeight; }
  };
  $('clear').onclick = () => { rows.innerHTML = ''; };

  function passesFilter(c) {
    const min = +$('minconf').value || 0;
    const want = $('clsfilter').value;
    if (c.result.score * 100 < min) return false;
    if (want && c.result.class !== want) return false;
    return true;
  }

  function addRow(c) {
    if (!passesFilter(c)) return;
    const r = c.result;
    const tr = document.createElement('tr');
    const lowconf = r.score < 0.6;
    if (lowconf) tr.className = 'lowconf';
    if (r.disagreement) tr.className += ' disagree';
    const t = new Date(c.ts).toISOString().substr(11, 12);
    const models = (r.models || []).map(m => `${m.role[0].toUpperCase()}:${m.class} ${(m.score*100).toFixed(0)}%`).join('  ');
    tr.innerHTML =
      `<td class="dim">${t}</td>` +
      `<td>${c.sensor || '-'}</td>` +
      `<td>${c.initiator_ip}:${c.initiator_port}</td>` +
      `<td class="dim">&#8594;</td>` +
      `<td>${c.responder_ip}:${c.responder_port}</td>` +
      `<td class="dim">${c.proto}</td>` +
      `<td><span class="cls ${r.class}">${r.class.toUpperCase()}</span></td>` +
      `<td><span class="bar" style="width:${Math.max(2, r.score*80)|0}px"></span> ${(r.score*100).toFixed(1)}%</td>` +
      `<td class="dim">${models}</td>`;
    rows.appendChild(tr);
  }

  function trim() {
    while (rows.children.length > MAX_ROWS) rows.removeChild(rows.firstChild);
  }

  function onEvents(list) {
    let touched = false;
    for (const ev of list) {
      if (ev.type !== 'ClassificationCreated') continue;
      if (paused) { pending.push(ev.data); if (pending.length > MAX_ROWS) pending.shift(); continue; }
      addRow(ev.data);
      touched = true;
    }
    if (touched) {
      trim();
      const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40;
      if (atBottom) scroller.scrollTop = scroller.scrollHeight;
    }
  }

  async function poll() {
    try {
      const s = await (await fetch('/api/v1/status')).json();
      $('s-flows').textContent = s.storage.flows;
      $('s-cls').textContent = s.storage.classifications;
      $('s-clients').textContent = s.live.clients;
      if (s.replay && s.replay.running)
        $('rstat').textContent = `running ${s.replay.source} @${s.replay.speed} — ${s.replay.packets} pkts, ${s.replay.flows} flows`;
      else if (s.replay && s.replay.last_error)
        $('rstat').textContent = 'error: ' + s.replay.last_error;
      else $('rstat').textContent = 'idle';
    } catch (e) { /* ignore */ }
  }
  setInterval(poll, 1000); poll();

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/api/v1/stream`);
    ws.onopen = () => { $('s-conn').textContent = 'live'; $('s-conn').style.color = 'var(--accent)'; };
    ws.onclose = () => { $('s-conn').textContent = 'reconnecting…'; $('s-conn').style.color = ''; setTimeout(connect, 1500); };
    ws.onmessage = e => { try { onEvents(JSON.parse(e.data)); } catch (_) {} };
  }
  connect();

  $('rstart').onclick = async () => {
    const body = JSON.stringify({ path: $('rpath').value, speed: $('rspeed').value });
    const res = await fetch('/api/v1/replay', { method: 'POST', body });
    $('rstat').textContent = res.ok ? 'started' : 'start failed: ' + (await res.text());
  };
  $('rstop').onclick = async () => { await fetch('/api/v1/replay/stop', { method: 'POST' }); };
})();
</script>
</body>
</html>
