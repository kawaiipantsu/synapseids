# synapseids.conf — TLS-terminating reverse proxy for synapsed
# THUGS(red) SynapseIDS
#
# Install (Debian/Ubuntu style):
#   install -m 0644 contrib/nginx/synapseids.conf /etc/nginx/sites-available/synapseids.conf
#   ln -s ../sites-available/synapseids.conf /etc/nginx/sites-enabled/synapseids.conf
# Install (RHEL/conf.d style):
#   install -m 0644 contrib/nginx/synapseids.conf /etc/nginx/conf.d/synapseids.conf
#
#   nginx -t && systemctl reload nginx
#
# This file is included at http{} context (both layouts do that), so the map{}
# below is valid here.
#
# PROJECT.md §21: synapsed binds to localhost and performs NO authentication or
# TLS itself. Any access from a non-loopback address MUST be authenticated and
# encrypted here. Create the Basic-auth file (the floor, not the ceiling) with:
#
#   htpasswd -c /etc/nginx/synapseids.htpasswd operator
#
# then uncomment the `auth_basic` lines in the server block. Prefer mTLS or an
# SSO / oauth2-proxy in front for real deployments.

# Map the Upgrade request header to the right Connection response for the
# WebSocket live channel; "" -> close so keep-alived REST requests are clean.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream synapsed {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---- HTTP: redirect everything to HTTPS ---------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name synapse.example.org;          # <-- change

    location / {
        return 308 https://$host$request_uri;
    }
}

# ---- HTTPS: the actual proxy ------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name synapse.example.org;          # <-- change

    # --- TLS (placeholders — point at your real cert/key) ---
    ssl_certificate     /etc/ssl/synapseids/fullchain.pem;
    ssl_certificate_key /etc/ssl/synapseids/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SynapseTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # ssl_stapling on; ssl_stapling_verify on;   # if your CA supports OCSP

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;

    # --- Authentication (PROJECT.md §21) --------------------------------
    # REQUIRED for any non-local exposure. Uncomment both lines:
    #   auth_basic           "SynapseIDS";
    #   auth_basic_user_file /etc/nginx/synapseids.htpasswd;
    # ------------------------------------------------------------------

    client_max_body_size 64m;    # headroom if PCAP uploads are ever proxied

    # WebSocket live event channel: GET /api/v1/stream
    # Needs HTTP/1.1 + Upgrade/Connection headers and a long read timeout —
    # batched frames can be quiet for minutes between bursts.
    location = /api/v1/stream {
        proxy_pass                    http://synapsed;
        proxy_http_version            1.1;
        proxy_set_header Upgrade      $http_upgrade;
        proxy_set_header Connection   $connection_upgrade;
        proxy_set_header Host         $host;
        proxy_set_header X-Real-IP    $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout            3600s;
        proxy_send_timeout            3600s;
        proxy_buffering               off;
    }

    # REST API
    location /api/ {
        proxy_pass                    http://synapsed;
        proxy_http_version            1.1;
        proxy_set_header Connection   "";
        proxy_set_header Host         $host;
        proxy_set_header X-Real-IP    $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout            120s;
    }

    # Web UI + everything else
    location / {
        proxy_pass                    http://synapsed;
        proxy_http_version            1.1;
        proxy_set_header Connection   "";
        proxy_set_header Host         $host;
        proxy_set_header X-Real-IP    $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout            120s;
    }
}
