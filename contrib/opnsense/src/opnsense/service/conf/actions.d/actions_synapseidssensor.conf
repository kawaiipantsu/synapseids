;
; Invoked as `configctl synapseidssensor <action> [instance]` and, from the MVC
; layer, via OPNsense\Core\Backend::configdRun('synapseidssensor <action> [instance]').
;
; EVERY LIFECYCLE ACTION TAKES AN OPTIONAL INSTANCE NAME (issue #124). The
; firewall runs one synapse-sensor process per captured interface, so
;
;     configctl synapseidssensor restart          -> every instance
;     configctl synapseidssensor restart wan      -> just that one
;
; must both work. That is what the `parameters:%s` lines are for: configd
; substitutes the caller's parameter into the `parameters:` template, SINGLE
; QUOTING it first (Action._cmd_builder in
; /usr/local/opnsense/service/modules/actions/base.py replaces ' with '"'"'
; before substituting), so a parameter cannot break out of the command. When no
; parameter is given configd fills in an empty string, which the rc.d script
; reads as "all instances".
;
; The `%s` therefore lives ONLY on `parameters:` lines and never on a `command:`
; line, where configd's substitution would eat it. check-plugin.sh and
; TestStopAndRestartActionsToleratePreStoppedService both assert that.
;
; Several commands are `/bin/sh -c '...' sh` so that the appended parameter
; lands in "$1" in the middle of a compound command rather than at the very end,
; which is the only place configd can put it.
;
; There is deliberately no [template] action: reconfigure in
; ApiMutableServiceControllerBase (and Api\SettingsController::setAction) issues
; `template reload OPNsense/SynapseIDSSensor` itself.
;
; None of these commands ever reads, echoes or logs the bearer token.

[start]
command:/usr/local/etc/rc.d/synapseids_sensor onestart
parameters:%s
type:script
message:starting the SynapseIDS sensors
description:Start the SynapseIDS capture sensors (all, or one named instance)

; Stopping an already-stopped service is a NO-OP, not a failure. rc.subr's
; default stop warns "synapseids_sensor not running? (check <pidfile>)" and
; returns 1, and configd turns a non-zero exit from a type:script action into
; the GUI's "Unexpected error, check log for details". Saving the settings page
; with the sensors disabled calls this action, so every such save failed even
; though the configuration had been written and the template rendered fine.
; Guard on status first; a genuine stop failure still propagates.
[stop]
command:/bin/sh -c 'if /usr/local/etc/rc.d/synapseids_sensor onestatus "$1" >/dev/null 2>&1; then /usr/local/etc/rc.d/synapseids_sensor onestop "$1"; else /usr/local/etc/rc.d/synapseids_sensor onestop "$1" >/dev/null 2>&1; exit 0; fi' sh
parameters:%s
type:script
message:stopping the SynapseIDS sensors
description:Stop the SynapseIDS capture sensors (all, or one named instance)

; Same reasoning: a restart of a stopped sensor is just a start. The stop half is
; best-effort and its output discarded, while the start half decides the exit
; status -- a sensor that cannot start must still fail loudly.
[restart]
command:/bin/sh -c '/usr/local/etc/rc.d/synapseids_sensor onestatus "$1" >/dev/null 2>&1 && /usr/local/etc/rc.d/synapseids_sensor onestop "$1" >/dev/null 2>&1; /usr/local/etc/rc.d/synapseids_sensor onestart "$1"' sh
parameters:%s
type:script
message:restarting the SynapseIDS sensors
description:Restart the SynapseIDS capture sensors (all, or one named instance)

; `onestatus` exits non-zero when a daemon is not running, which is a normal
; answer rather than an error, hence the trailing `exit 0`.  The text it prints
; ("... is running as pid N." / "... is not running.") is what
; ApiMutableServiceControllerBase::statusAction() parses; with several instances
; it prints one such line per instance, preceded by a "===> sensor instance:"
; header, so the core widget reports "not running" as soon as ANY instance is
; down. That is the conservative reading and the right default; the settings
; page additionally shows a per-instance breakdown from
; /api/synapseidssensor/service/instances.
;
; The `; exit 0` is deliberate and stays.  Whether configd's script_output
; handler returns stdout alongside a non-zero exit status could not be confirmed
; from a Linux build host -- so rather than depend on the answer, the command is
; written so the question never arises: it always exits 0 and the caller reads
; the text.  The cost is that a genuine failure of this one read-only command is
; reported as empty output rather than as an error, which the UI already renders
; as "unknown".  The actions that must be able to fail -- start, stop, restart --
; are type:script and carry no `exit 0`.
[status]
command:/bin/sh -c '/usr/local/etc/rc.d/synapseids_sensor onestatus "$1"; exit 0' sh
parameters:%s
type:script_output
message:requesting the SynapseIDS sensor status
description:Status of the SynapseIDS capture sensors (all, or one named instance)

; Tail of a sensor log. Each instance writes to its own directory
; (/var/log/synapseids/<instance>/sensor.log) so that four sensors do not
; interleave into one file where no line can be attributed; with no parameter
; this tails all of them, and tail(1) prints its own "==> path <==" headers.
;
; The parameter is re-validated here against the model's own Mask before it is
; used to build a path. configd already single-quotes it, so this is not about
; quoting -- it is about a name like ../../etc/passwd turning a log viewer into
; an arbitrary-file reader. Anything that is not letters, digits or underscore
; is discarded and the command falls back to "all instances".
;
; synapse-sensor never writes the token to its log, so nothing here needs
; stripping; Api\ServiceController redacts the configured token from the
; response anyway as a second line of defence.
[log]
command:/bin/sh -c 'p="$1"; case "$p" in ""|*[!A-Za-z0-9_]*) p="";; esac; if [ -n "$p" ]; then /usr/bin/tail -n 200 /var/log/synapseids/"$p"/sensor.log 2>/dev/null; else /usr/bin/tail -n 200 /var/log/synapseids/*/sensor.log 2>/dev/null; fi; exit 0' sh
parameters:%s
type:script_output
message:reading the SynapseIDS sensor log
description:Show the last 200 lines of a SynapseIDS sensor log (all, or one named instance)

; Ownership and permission fixup, run right after EVERY `template reload`.
;
; The logic moved into a script when the number of files stopped being fixed:
; there is now one rendered configuration and one log directory per instance,
; plus stale instance files to prune when one is renamed or deleted. See
; scripts/OPNsense/SynapseIDSSensor/fixperms.sh, which is `sh -n` checked by
; contrib/opnsense/tools/check-plugin.sh -- something an ini one-liner never was.
[fixperms]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/SynapseIDSSensor/fixperms.sh
parameters:
type:script
message:fixing SynapseIDS sensor file permissions
description:Restrict the sensor token, TLS private key and per-instance log directories

; On-box selftest: binary, service account, BPF access, capture device, rendered
; configuration, token mode, TLS material and collector reachability, one
; pass/fail line each -- PER INSTANCE, with the instance name in its own column,
; so an operator with four sensors can see which one is broken. This is the
; action behind the Selftest button on the settings page and behind
; `configctl synapseidssensor selftest [instance]`.
;
; It is read-only -- it never writes, chowns or chmods anything -- and it never
; prints the bearer token or any key material, only paths, modes and subjects.
; `; exit 0` for the same reason as [status]: doctor exits 1 when a check fails,
; which is exactly the case whose output an operator most needs to see.
[selftest]
command:/bin/sh -c '/usr/local/etc/rc.d/synapseids_sensor selftest "$1" 2>&1; exit 0' sh
parameters:%s
type:script_output
message:running the SynapseIDS sensor selftest
description:Check the SynapseIDS sensor configuration, privileges and connectivity
