;
; Invoked as `configctl synapseidssensor <action>` and, from the MVC layer, via
; OPNsense\Core\Backend::configdRun('synapseidssensor <action>').
;
; There is deliberately no [template] action: reconfigure in
; ApiMutableServiceControllerBase (and Api\SettingsController::setAction) issues
; `template reload OPNsense/SynapseIDSSensor` itself.
;
; None of these commands ever reads, echoes or logs the bearer token.

[start]
command:/usr/local/etc/rc.d/synapseids_sensor onestart
parameters:
type:script
message:starting the SynapseIDS sensor
description:Start the SynapseIDS capture sensor

[stop]
command:/usr/local/etc/rc.d/synapseids_sensor onestop
parameters:
type:script
message:stopping the SynapseIDS sensor
description:Stop the SynapseIDS capture sensor

[restart]
command:/usr/local/etc/rc.d/synapseids_sensor onerestart
parameters:
type:script
message:restarting the SynapseIDS sensor
description:Restart the SynapseIDS capture sensor

; `onestatus` exits non-zero when the daemon is not running, which is a normal
; answer rather than an error, hence the trailing `exit 0`.  The text it prints
; ("... is running as pid N." / "... is not running.") is what
; ApiMutableServiceControllerBase::statusAction() parses.
;
; The `; exit 0` is deliberate and stays.  Whether configd's script_output
; handler returns stdout alongside a non-zero exit status could not be confirmed
; from a Linux build host — so rather than depend on the answer, the command is
; written so the question never arises: it always exits 0 and the caller reads
; the text.  The cost is that a genuine failure of this one read-only command is
; reported as empty output rather than as an error, which the UI already renders
; as "unknown".  The actions that must be able to fail — start, stop, restart —
; are type:script and carry no `exit 0`.
[status]
command:/usr/local/etc/rc.d/synapseids_sensor onestatus; exit 0
parameters:
type:script_output
message:requesting the SynapseIDS sensor status
description:Status of the SynapseIDS capture sensor

; Tail of the sensor log.  synapse-sensor never writes the token to its log, so
; nothing here needs stripping; Api\ServiceController redacts the configured
; token from the response anyway as a second line of defence.
[log]
command:/usr/bin/tail -n 200 /var/log/synapseids/sensor.log 2>/dev/null; exit 0
parameters:
type:script_output
message:reading the SynapseIDS sensor log
description:Show the last 200 lines of the SynapseIDS sensor log

; Ownership and permission fixup, run right after EVERY `template reload`.
;
; configd renders templates as root with its own umask, which would leave the
; two secrets on this box — the bearer token and the TLS private key — world
; readable for as long as it took an operator to notice.  This action closes that
; window.  Both callers of `template reload` run it immediately afterwards
; (Api\SettingsController::applyConfiguration and
; Api\ServiceController::reconfigureAction), and the rc.d start_precmd re-checks
; before every start.
;
;   /usr/local/etc/synapseids                 root:_synapseids 0750  (traversable, not listable by others)
;   /usr/local/etc/synapseids/sensor.token    _synapseids:_synapseids 0400  SECRET
;   /usr/local/etc/synapseids/sensor-key.pem  _synapseids:_synapseids 0400  SECRET (issue #104)
;   /usr/local/etc/synapseids/sensor.conf     root:wheel 0640 (flags only, no secrets)
;   /usr/local/etc/synapseids/sensor-ca.pem   root:wheel 0444 (public trust material)
;   /usr/local/etc/synapseids/sensor-cert.pem root:wheel 0444 (public certificate)
;   /var/log/synapseids                       _synapseids:wheel 0750
;
; The inline `fp` helper keeps this to one line without needing any `%`
; character, which configd's parameter substitution would otherwise interpret.
; A file that has not been rendered yet is skipped rather than treated as an
; error, so this is safe to run at any time.
[fixperms]
command:/bin/mkdir -p /usr/local/etc/synapseids /var/log/synapseids && /usr/sbin/chown root:_synapseids /usr/local/etc/synapseids && /bin/chmod 0750 /usr/local/etc/synapseids && /usr/sbin/chown _synapseids:wheel /var/log/synapseids && /bin/chmod 0750 /var/log/synapseids; fp() { [ -f "$2" ] || return 0; /usr/sbin/chown "$1" "$2"; /bin/chmod "$3" "$2"; }; fp _synapseids:_synapseids /usr/local/etc/synapseids/sensor.token 0400; fp _synapseids:_synapseids /usr/local/etc/synapseids/sensor-key.pem 0400; fp root:wheel /usr/local/etc/synapseids/sensor.conf 0640; fp root:wheel /usr/local/etc/synapseids/sensor-ca.pem 0444; fp root:wheel /usr/local/etc/synapseids/sensor-cert.pem 0444; exit 0
parameters:
type:script
message:fixing SynapseIDS sensor file permissions
description:Restrict the sensor token, TLS private key and log directory

; On-box selftest: binary, service account, BPF access, capture device, rendered
; configuration, token mode, TLS material and collector reachability, one
; pass/fail line each.  This is the action behind the Selftest button on the
; settings page and behind `configctl synapseidssensor selftest`.
;
; It is read-only — it never writes, chowns or chmods anything — and it never
; prints the bearer token or any key material, only paths, modes and subjects.
; `; exit 0` for the same reason as [status]: doctor exits 1 when a check fails,
; which is exactly the case whose output an operator most needs to see.
[selftest]
command:/usr/local/etc/rc.d/synapseids_sensor selftest 2>&1; exit 0
parameters:
type:script_output
message:running the SynapseIDS sensor selftest
description:Check the SynapseIDS sensor configuration, privileges and connectivity
