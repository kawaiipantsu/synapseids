{#
 # sensor-instance.conf - configd (Jinja2) template rendered ONCE PER INSTANCE to
 #     /usr/local/etc/synapseids/instances/<name>.conf
 #
 # Copyright (C) 2026 SynapseIDS contributors
 # BSD 2-Clause; see Sensor.php for the full text.
 #
 # HOW THE ONE-FILE-PER-INSTANCE PART WORKS
 #
 # +TARGETS maps this template to a destination containing a bracketed tag:
 #
 #   sensor-instance.conf:/usr/local/etc/synapseids/instances/[OPNsense.SynapseIDSSensor.instances.instance.%.name].conf:...
 #
 # That is configd's own repeating-target syntax (Template.__find_string_tags /
 # __find_filters in /usr/local/opnsense/service/modules/template.py): the `%`
 # wildcard enumerates the repeating <instance> nodes, the trailing `.name`
 # selects the value that goes into the filename, and configd renders this
 # template once per resulting file with TARGET_FILTERS set to
 # {<resolved path>: <that value>}.  So TARGET_FILTERS is how this template
 # learns WHICH instance it is rendering, and it is the only way it can.
 #
 # config.xml turns a repeating tag into a list, but a SINGLE occurrence into a
 # plain dict.  helpers.toList() is the core helper that hides that difference,
 # so both are iterated the same way here and a firewall with exactly one sensor
 # is not a special case.
 #
 # WHAT THIS RENDERS: the same variable names a 1.0.0 sensor.conf carried, so
 # that `synapse-sensor doctor --config <this file>` needs no change at all to
 # check one instance - which is what makes a per-instance selftest possible.
 #
 #   synapseids_sensor_enable      YES | NO    (rc.subr rcvar for this profile)
 #   synapseids_sensor_instance    this instance's name, for diagnostics
 #   synapseids_sensor_iface       resolved kernel device name, or EMPTY on failure
 #   synapseids_sensor_iface_id    the OPNsense interface identifier it came from
 #   synapseids_sensor_iface_src   how it was resolved, for diagnostics
 #   synapseids_sensor_iface_error why resolution failed; non-empty = REFUSE TO START
 #   synapseids_sensor_args        every synapse-sensor flag EXCEPT the token
 #
 # THE BEARER TOKEN IS NEVER RENDERED HERE.  It lives only in sensor.token
 # (0400 _synapseids:_synapseids), is shared by every instance, and reaches each
 # sensor as --token-file, so it is absent from argv, from ps(1) and from this
 # file.  TLS material is likewise referenced only by path:
 #
 #     /usr/local/etc/synapseids/sensor-ca.pem    0444 root:wheel   --ca / --client-ca
 #     /usr/local/etc/synapseids/sensor-cert.pem  0444 root:wheel   --cert
 #     /usr/local/etc/synapseids/sensor-key.pem   0400 _synapseids  --key
 #
 # NOTE on quoting: rc.subr builds the start command into a single string and
 # runs it through eval, so single-quoted values inside $synapseids_sensor_args
 # survive.  Every value interpolated below goes through the sh() macro, which
 # removes every character that could break out of the generated shell word:
 #
 #   ' " `        would close the quoting the template put around the value
 #   $           would be expanded by the shell that sources this file
 #   ; | &       would start a new command if the quoting were ever defeated
 #   < > \       redirection and escaping
 #   newline     would forge an extra assignment line
 #
 # Each model field also carries a Mask in Sensor.xml that already excludes
 # these, so this is the second of two independent barriers, not the only one.
 #
 # WHITESPACE CONTROL: below the macro there is deliberately no minus sign on
 # any tag, opening or closing.  configd renders with trim_blocks=True, so a tag
 # on its own line at column 0 already consumes its own trailing newline; adding
 # a leading dash additionally eats the newline of the PRECEDING line, which is
 # how an earlier release glued `synapseids_sensor_enable="YES"` onto the
 # `# Generated by OPNsense` comment and shipped a file that /bin/sh sourced as
 # one comment and set nothing.  render-templates.py sources every rendered file
 # with /bin/sh, and parses it the way the Go doctor does, to make that class of
 # bug impossible to ship again.
 #
 # (Note for whoever edits this header: a Jinja comment ends at the first
 # closing marker it contains, so writing one out literally in here truncates
 # the comment and dumps the rest of the prose into the rendered file. That is
 # not hypothetical - it happened while this very paragraph was being written,
 # and the harness caught it.)
 #
 # Config values are read with SUBSCRIPT syntax - item['name'], not item.name -
 # because Jinja resolves dotted access with getattr() first and several model
 # field names would otherwise collide with dict methods.
 #}
{%- macro sh(value) -%}
{{ value | default('', true) | string | replace("'", "") | replace('"', '') | replace('`', '') | replace('$', '') | replace(';', '') | replace('|', '') | replace('&', '') | replace('<', '') | replace('>', '') | replace('\\', '') | replace('\n', ' ') | replace('\r', ' ') | trim }}
{%- endmacro -%}
{%- macro pname(value) -%}
{{ (sh(value) | regex_replace('[^A-Za-z0-9_]', ''))[:32] }}
{%- endmacro -%}
# Generated by OPNsense - do not edit.
{#
 # Which instance is this?  TARGET_FILTERS holds exactly one entry, whose value
 # is the <name> that produced this file's name.
 #
 # pname() is applied to BOTH sides of the comparison. The name reaches a
 # filename, an rc.d profile and a shell word, and Sensor.xml's Mask is what
 # normally keeps it to [A-Za-z0-9_] - but a config.xml edited by hand has no
 # Mask, and configd only applies basename() to the value it puts in the path.
 # A name that does not survive pname() unchanged therefore matches nothing and
 # this file renders inert, which is the safe direction.
 #}
{% set want = pname((TARGET_FILTERS | default({}, true)).values() | list | first) %}
{% set matched = [] %}
{% for item in helpers.toList('OPNsense.SynapseIDSSensor.instances.instance') %}
{% if want != '' and pname(item['name']) == want and matched | length == 0 %}
{% do matched.append(item) %}
{% endif %}
{% endfor %}
{% if matched | length == 1 %}
{% set node = matched[0] %}
{% set general = helpers.getNodeByTag('OPNsense.SynapseIDSSensor.general') or {} %}
{#
 # ---------------------------------------------------------------------------
 # Interface identifier -> real device name.  THE MOST IMPORTANT LOOKUP HERE.
 #
 # The model stores OPNsense interface *identifiers* ("wan", "lan", "opt3"), but
 # synapse-sensor needs the kernel device name ("em0", "vtnet0", "igb0.10").  If
 # this resolves wrongly the sensor binds to nothing and captures zero packets
 # while still reporting "running", which is the worst failure this plugin has -
 # far worse than not starting.  So it is resolved two ways and, when neither
 # works, it deliberately produces a configuration the rc.d script REFUSES to
 # start, carrying a description of what was attempted.
 #
 # 1. interfaces[<identifier>]['if'] - the primary path.  config.xml holds
 #    <interfaces><wan><if>em0</if></wan>, and configd renders templates against
 #    the whole configuration tree, so `interfaces` is a sibling key of
 #    `OPNsense`.  A plain subscript also cannot raise, so it is tried first.
 #
 # 2. helpers.physical_interface(<identifier>) - the fallback, guarded by an
 #    `is defined` test so a core without that helper simply skips it.
 #
 #    IT RETURNS THE IDENTIFIER UNCHANGED WHEN IT CANNOT RESOLVE IT.  The core
 #    helper is literally `getNodeByTag('interfaces.'+name+'.if') or name`, so an
 #    unknown identifier comes back as itself.  Taking that at face value is
 #    precisely the mistake this template must never make: "wan" is a plausible
 #    looking device name, and a bare identifier that happened to collide with a
 #    real device would capture the WRONG interface, silently.  So a result equal
 #    to the identifier is treated as "not found".
 #
 # 3. Neither worked -> synapseids_sensor_iface is left EMPTY and
 #    synapseids_sensor_iface_error records the identifier and both attempts.
 #    The rc.d script fails the start with that text, and `synapse-sensor doctor`
 #    prints it as a [FAIL] line.
 #
 # The resolved device is additionally checked for existence at start time by the
 # rc.d script (ifconfig) and by `synapse-sensor doctor` (which lists the devices
 # that do exist), so a stale identifier is caught even when the lookup itself
 # succeeded.
 # ---------------------------------------------------------------------------
 #}
{% set if_id = sh(node['interface']).split(',')[0] | trim %}
{% set if_dev = '' %}
{% set if_src = '' %}
{% if if_id != '' %}
{% if interfaces is defined and if_id in interfaces and interfaces[if_id]['if'] is defined %}
{% set if_dev = sh(interfaces[if_id]['if']) %}
{% set if_src = 'interfaces.' ~ if_id ~ '.if' %}
{% elif helpers is defined and helpers.physical_interface is defined %}
{% set probe = sh(helpers.physical_interface(if_id)) %}
{% if probe != '' and probe != if_id %}
{% set if_dev = probe %}
{% set if_src = 'helpers.physical_interface(' ~ if_id ~ ')' %}
{% endif %}
{% endif %}
{% endif %}
{#
 # iface_src only ever names a lookup that SUCCEEDED, so it can be read as
 # "this is how the device name was obtained". On failure it is cleared and
 # iface_error names both attempts instead.
 #}
{% if if_dev == '' %}
{% set if_src = '' %}
{% endif %}
{#
 # NOTE: no double quote characters in the error message - it is emitted inside
 # a double-quoted shell assignment that rc.subr sources.
 #}
{% if if_id != '' and if_dev == '' %}
{% set if_error = 'interface identifier ' ~ if_id ~ ' could not be resolved to a device name. Tried interfaces.' ~ if_id ~ '.if and helpers.physical_interface(). Re-select the interface for sensor instance ' ~ want ~ ' on Services then SynapseIDS Sensor, and check Interfaces then Assignments.' %}
{% else %}
{% set if_error = '' %}
{% endif %}
{% set mode = sh(general['mode']) or 'listen' %}
{#
 # ---------------------------- build the flags -----------------------------
 #}
{% set args = [] %}
{% if mode == 'connect' %}
{% do args.append('--connect ' ~ sh(general['address'])) %}
{% else %}
{% do args.append('--listen ' ~ (sh(node['listen_address']) or '0.0.0.0:4789')) %}
{% endif %}
{% if if_dev != '' %}
{% do args.append('--iface ' ~ if_dev) %}
{% endif %}
{% if sh(node['filter']) != '' %}
{% do args.append('--filter ' ~ sh(node['filter'])) %}
{% endif %}
{% if sh(node['direction']) != '' %}
{% do args.append('--direction ' ~ sh(node['direction'])) %}
{% endif %}
{% if sh(node['promiscuous']) == '1' %}
{% do args.append('--promisc') %}
{% endif %}
{% if sh(node['snaplen']) != '' %}
{% do args.append('--snaplen ' ~ sh(node['snaplen'])) %}
{% endif %}
{% if sh(node['bpf_buffer']) != '' %}
{% do args.append('--bpf-buffer ' ~ sh(node['bpf_buffer'])) %}
{% endif %}
{#
 # What to send: raw frames, flow records, or only the computed feature vectors
 # (the `mode` flag; the model field is send_mode because `mode` is already
 # taken by the listen/connect posture in <general>).
 #
 # raw is the default and is omitted so an older sensor binary that predates the
 # flag still starts. flow and feature need SYNPOIP v2 on both ends.
 #}
{% if sh(node['send_mode']) != '' and sh(node['send_mode']) != 'raw' %}
{% do args.append('--mode ' ~ sh(node['send_mode'])) %}
{% endif %}
{#
 # Log verbosity (SynapseIDS > General). Shared by every instance. `normal` is
 # the binary's own default, so it is omitted - which also means an older sensor
 # binary that predates the flag still starts, exactly like the `raw` case above.
 #}
{% if sh(general['log_level']) != '' and sh(general['log_level']) != 'normal' %}
{% do args.append('--log-level ' ~ sh(general['log_level'])) %}
{% endif %}
{% if sh(node['sensor_id']) != '' %}
{% do args.append("--sensor-id '" ~ sh(node['sensor_id']) ~ "'") %}
{% endif %}
{% if sh(node['location']) != '' %}
{% do args.append("--location '" ~ sh(node['location']) ~ "'") %}
{% endif %}
{#
 # --authorized is mandatory for --iface and is a PER INSTANCE assertion:
 # Sensor::performValidation refuses to save an enabled instance without it, and
 # it is never inherited from another instance (PROJECT.md 28.18).
 #}
{% if sh(node['authorized']) == '1' %}
{% do args.append('--authorized') %}
{% endif %}
{#
 # TLS material, shared by every instance on this firewall.  Only *paths* are
 # emitted; see the file header for how the PEM content itself gets to disk.
 #   listen  mode: --cert/--key are the server identity, --client-ca enforces mTLS
 #   connect mode: --cert/--key are the client identity, --ca verifies the collector
 #}
{% if sh(general['client_cert']) != '' and sh(general['client_key']) != '' %}
{% do args.append('--cert /usr/local/etc/synapseids/sensor-cert.pem') %}
{% do args.append('--key /usr/local/etc/synapseids/sensor-key.pem') %}
{% endif %}
{% if mode == 'connect' %}
{% if sh(general['verify_peer']) != '0' %}
{% if sh(general['ca']) != '' %}
{% do args.append('--ca /usr/local/etc/synapseids/sensor-ca.pem') %}
{% endif %}
{% else %}
{% do args.append('--insecure-tls') %}
{% endif %}
{% else %}
{% if sh(general['ca']) != '' %}
{% do args.append('--client-ca /usr/local/etc/synapseids/sensor-ca.pem') %}
{% endif %}
{% endif %}
{#
 # ------------------------------- output -----------------------------------
 # Enabled means BOTH switches are on: the plugin-wide one and this instance's.
 #}
{% if sh(general['enabled']) == '1' and sh(node['enabled']) == '1' %}
synapseids_sensor_enable="YES"
{% else %}
synapseids_sensor_enable="NO"
{% endif %}
synapseids_sensor_instance="{{ want }}"
synapseids_sensor_iface="{{ if_dev }}"
synapseids_sensor_iface_id="{{ if_id }}"
synapseids_sensor_iface_src="{{ if_src }}"
synapseids_sensor_iface_error="{{ if_error }}"
synapseids_sensor_args="{{ args | join(' ') }}"
{% else %}
# No instance of this name is configured, so this file is inert. It is a
# leftover from an instance that was renamed or deleted; the fixperms configd
# action removes instance files that no longer match a configured instance.
synapseids_sensor_enable="NO"
synapseids_sensor_instance="{{ want }}"
synapseids_sensor_iface=""
synapseids_sensor_iface_id=""
synapseids_sensor_iface_src=""
synapseids_sensor_iface_error=""
synapseids_sensor_args=""
{% endif %}
