{#
 # sensor.conf - configd (Jinja2) template for /usr/local/etc/synapseids/sensor.conf
 #
 # Copyright (C) 2026 SynapseIDS contributors
 # BSD 2-Clause; see Sensor.php for the full text.
 #
 # THIS FILE IS THE INDEX, NOT A SENSOR.
 #
 # Since issue #124 the firewall runs one synapse-sensor process per captured
 # interface, so the per-sensor flags live in
 #
 #     /usr/local/etc/synapseids/instances/<name>.conf
 #
 # one per instance, rendered by sensor-instance.conf.  What is left here is the
 # list of profiles that /usr/local/etc/rc.d/synapseids_sensor iterates:
 #
 #   synapseids_sensor_profiles   space separated instance names, in model order
 #   synapseids_sensor_instdir    where the per-instance files are
 #
 # The remaining variables are the ones a 1.0.0 release rendered here, kept so
 # that anything which sources this file - an older rc.d script left behind by a
 # partial upgrade, or `synapse-sensor doctor` run with its default --config -
 # reads a coherent, SWITCHED-OFF configuration rather than a half-populated one.
 #
 # synapseids_sensor_enable is therefore deliberately "NO" in this file even when
 # the plugin is enabled.  The rc.d script never consults it: it dispatches per
 # profile and each instance file carries its own rcvar.  An old script that does
 # consult it declines to start, which is the safe direction, and a bare
 # `synapse-sensor doctor` reports a disabled sensor with no interface (a WARN
 # and a SKIP) instead of inventing a phantom failure about a missing
 # authorisation flag.  The command that actually says something useful is
 #
 #     service synapseids_sensor selftest          # every instance
 #     service synapseids_sensor selftest wan      # one of them
 #
 # NO SECRETS OF ANY KIND ARE RENDERED HERE, exactly as before: the bearer token
 # lives only in sensor.token (0400 _synapseids) and reaches each sensor as
 # --token-file, and the TLS material lives in sensor-ca.pem / sensor-cert.pem /
 # sensor-key.pem with only their paths reaching argv.
 #
 # Config values are read with SUBSCRIPT syntax - item['name'], not item.name.
 # configd hands templates plain dicts, and Jinja resolves dotted access with
 # getattr() first, so a field whose name collides with a dict method (items,
 # keys, values, get, copy, pop) would silently evaluate to a bound method
 # instead of the stored value. Subscripting cannot do that.
 #
 # Quoting: every interpolated value goes through the sh() macro, which is
 # BYTE-FOR-BYTE THE SAME MACRO as in sensor-instance.conf (a harness scenario
 # asserts that) and removes every character that could break out of the
 # generated shell word.
 #}
{%- macro sh(value) -%}
{{ value | default('', true) | string | replace("'", "") | replace('"', '') | replace('`', '') | replace('$', '') | replace(';', '') | replace('|', '') | replace('&', '') | replace('<', '') | replace('>', '') | replace('\\', '') | replace('\n', ' ') | replace('\r', ' ') | trim }}
{%- endmacro -%}
{%- macro pname(value) -%}
{{ (sh(value) | regex_replace('[^A-Za-z0-9_]', ''))[:32] }}
{%- endmacro -%}
# Generated by OPNsense - do not edit.
# Index only: the per-sensor configuration is in instances/<name>.conf.
{% set profiles = [] %}
{% for item in helpers.toList('OPNsense.SynapseIDSSensor.instances.instance') %}
{% set iname = pname(item['name']) %}
{% if iname != '' and iname not in profiles %}
{% do profiles.append(iname) %}
{% endif %}
{% endfor %}
synapseids_sensor_enable="NO"
synapseids_sensor_profiles="{{ profiles | join(' ') }}"
synapseids_sensor_instdir="/usr/local/etc/synapseids/instances"
synapseids_sensor_iface=""
synapseids_sensor_iface_id=""
synapseids_sensor_iface_src=""
synapseids_sensor_iface_error=""
synapseids_sensor_args=""
