{#
 # sensor.conf - configd (Jinja2) template for /usr/local/etc/synapseids/sensor.conf
 #
 # Copyright (C) 2026 SynapseIDS contributors
 # BSD 2-Clause; see Sensor.php for the full text.
 #
 # Renders a POSIX-sh fragment that /usr/local/etc/rc.d/synapseids_sensor
 # sources.  It intentionally produces *variables*, not a ready-made command
 # line, so that the one value that must never reach argv - the bearer token -
 # can be kept in a separate 0400 file (sensor.token) and passed as
 # --token-file by the rc script.
 #
 # Variables produced - and NO SECRETS of any kind:
 #   synapseids_sensor_enable      YES | NO    (rc.subr rcvar)
 #   synapseids_sensor_iface       resolved kernel device name, or EMPTY on failure
 #   synapseids_sensor_iface_id    the OPNsense interface identifier it came from
 #   synapseids_sensor_iface_src   how it was resolved, for diagnostics
 #   synapseids_sensor_iface_error why resolution failed; non-empty = REFUSE TO START
 #   synapseids_sensor_args        every synapse-sensor flag EXCEPT the token
 #
 # THE BEARER TOKEN IS NEVER RENDERED HERE.  It lives only in sensor.token
 # (0400 _synapseids:_synapseids) and reaches the sensor as --token-file, so it
 # is absent from argv, from ps(1) and from this file.
 #
 # TLS material is NOT rendered here either: sensor.conf stays boring and is
 # kept at 0640 root:wheel.  The model holds the CA bundle, the sensor
 # certificate and its private key as PEM text; each has its OWN configd
 # template target (issue #104), and the flags below reference only the paths:
 #
 #     /usr/local/etc/synapseids/sensor-ca.pem    0444 root:wheel   --ca / --client-ca
 #     /usr/local/etc/synapseids/sensor-cert.pem  0444 root:wheel   --cert
 #     /usr/local/etc/synapseids/sensor-key.pem   0400 _synapseids  --key
 #
 # The private key is clamped by `configctl synapseidssensor fixperms`
 # immediately after every `template reload`, exactly as the bearer token is,
 # because configd renders as root under its own umask.  The rc.d script refuses
 # to start - with an explicit message naming the path - whenever a flag
 # references a PEM that is missing, empty or not PEM-shaped, so a bad render can
 # never silently downgrade transport security to an unverified connection.
 #
 # NOTE on quoting: rc.subr builds the start command into a single string and
 # runs it through eval, so single-quoted values inside $synapseids_sensor_args
 # survive.  Every value interpolated below goes through the sh() macro, which
 # removes every character that could break out of the generated shell word:
 #
 #   ' " `        would close the quoting the template put around the value
 #   $           would be expanded by the shell that sources this file
 #   ; | &       would start a new command if the quoting were ever defeated
 #   < > \       redirection and escaping
 #   newline     would forge an extra assignment line
 #
 # Each model field also carries a Mask in Sensor.xml that already excludes
 # these, so this is the second of two independent barriers, not the only one.
 # `synapse-sensor doctor` refuses to parse a sensor.conf that contains any of
 # them, which makes a regression here loud rather than silent.
 #}
{%- macro sh(value) -%}
{{ value | default('', true) | string | replace("'", "") | replace('"', '') | replace('`', '') | replace('$', '') | replace(';', '') | replace('|', '') | replace('&', '') | replace('<', '') | replace('>', '') | replace('\\', '') | replace('\n', ' ') | replace('\r', ' ') | trim }}
{%- endmacro -%}
# Generated by OPNsense - do not edit.
{% if helpers.exists('OPNsense.SynapseIDSSensor.general') %}
{%- set node = OPNsense.SynapseIDSSensor.general %}
{#-
 # ---------------------------------------------------------------------------
 # Interface identifier -> real device name.  THE MOST IMPORTANT LOOKUP HERE.
 #
 # The model stores OPNsense interface *identifiers* ("wan", "lan", "opt3"), but
 # synapse-sensor needs the kernel device name ("em0", "vtnet0", "igb0.10").  If
 # this resolves wrongly the sensor binds to nothing and captures zero packets
 # while still reporting "running", which is the worst failure this plugin has -
 # far worse than not starting.  So it is resolved two ways and, when neither
 # works, it deliberately produces a configuration the rc.d script REFUSES to
 # start, carrying a description of what was attempted.
 #
 # 1. interfaces[<identifier>]['if'] - the primary path.  config.xml holds
 #    <interfaces><wan><if>em0</if></wan>, and configd renders templates against
 #    the whole configuration tree: `OPNsense.SynapseIDSSensor.general` (which
 #    this template already depends on and which demonstrably works, or nothing
 #    below would ever have rendered) and `interfaces` are SIBLING keys of that
 #    one dict.  A plain subscript also cannot raise, so it is tried first.
 #
 # 2. helpers.physical_interface(<identifier>) - the fallback, guarded by an
 #    `is defined` test so a core without that helper simply skips it.  Used only
 #    if (1) produced nothing, because calling into a helper with an identifier
 #    the core does not know could raise and abort the whole render.
 #
 # 3. Neither worked -> synapseids_sensor_iface is left EMPTY and
 #    synapseids_sensor_iface_error records the identifier and both attempts.
 #    The rc.d script fails the start with that text, and `synapse-sensor doctor`
 #    prints it as a [FAIL] line.  It is emphatically NOT fallen back to emitting
 #    the bare identifier: "wan" is a plausible-looking device name, and a bare
 #    identifier that happened to collide with a real device would capture the
 #    WRONG interface silently.
 #
 # The resolved device is additionally checked for existence at start time by the
 # rc.d script (ifconfig) and by `synapse-sensor doctor` (which lists the devices
 # that do exist), so a stale identifier is caught even when the lookup itself
 # succeeded.
 # ---------------------------------------------------------------------------
 #}
{%- set if_id = (node.interface | default('', true) | string).split(',')[0] | trim %}
{%- set if_dev = '' %}
{%- set if_src = '' %}
{%- if if_id != '' %}
{%- if interfaces is defined and if_id in interfaces and interfaces[if_id]['if'] is defined %}
{%- set if_dev = interfaces[if_id]['if'] | string | trim %}
{%- set if_src = 'interfaces.' ~ if_id ~ '.if' %}
{%- elif helpers is defined and helpers.physical_interface is defined %}
{%- set if_dev = helpers.physical_interface(if_id) | default('', true) | string | trim %}
{%- set if_src = 'helpers.physical_interface(' ~ if_id ~ ')' %}
{%- endif %}
{%- endif %}
{%- set if_dev = sh(if_dev) %}
{#- iface_src only ever names a lookup that SUCCEEDED, so it can be read as
    "this is how the device name was obtained". On failure it is cleared and
    iface_error names both attempts instead. -#}
{%- if if_dev == '' %}
{%- set if_src = '' %}
{%- endif %}
{%- if if_id != '' and if_dev == '' %}
{#- NOTE: no double quote characters in this message - it is emitted inside a
    double-quoted shell assignment that rc.subr sources. -#}
{%- set if_error = 'interface identifier ' ~ sh(if_id) ~ ' could not be resolved to a device name. Tried interfaces.' ~ sh(if_id) ~ '.if and helpers.physical_interface(). Re-select the interface on Services then SynapseIDS Sensor, and check Interfaces then Assignments.' %}
{%- else %}
{%- set if_error = '' %}
{%- endif %}
{%- set mode = sh(node.mode) or 'listen' %}
{#- ---------------------------- build the flags ---------------------------- -#}
{%- set args = [] %}
{%- if mode == 'connect' %}
{%- set args = args + ['--connect ' ~ sh(node.address)] %}
{%- else %}
{%- set args = args + ['--listen ' ~ (sh(node.listen_address) or '0.0.0.0:4789')] %}
{%- endif %}
{%- if sh(if_dev) != '' %}
{%- set args = args + ['--iface ' ~ sh(if_dev)] %}
{%- endif %}
{%- if sh(node.filter) != '' %}
{%- set args = args + ['--filter ' ~ sh(node.filter)] %}
{%- endif %}
{%- if sh(node.direction) != '' %}
{%- set args = args + ['--direction ' ~ sh(node.direction)] %}
{%- endif %}
{%- if node.promiscuous | default('0', true) | string == '1' %}
{%- set args = args + ['--promisc'] %}
{%- endif %}
{%- if sh(node.snaplen) != '' %}
{%- set args = args + ['--snaplen ' ~ sh(node.snaplen)] %}
{%- endif %}
{#-
    What to send: raw frames, flow records, or only the computed feature
    vectors (the `mode` flag; the model field is send_mode because `mode`
    is already taken by the listen/connect posture above).

    raw is the default and is omitted so an older sensor binary that predates
    the flag still starts. flow and feature need SYNPOIP v2 on both ends.
-#}
{%- if sh(node.send_mode) != '' and sh(node.send_mode) != 'raw' %}
{%- set args = args + ['--mode ' ~ sh(node.send_mode)] %}
{%- endif %}
{%- if sh(node.sensor_id) != '' %}
{%- set args = args + ["--sensor-id '" ~ sh(node.sensor_id) ~ "'"] %}
{%- endif %}
{%- if sh(node.location) != '' %}
{%- set args = args + ["--location '" ~ sh(node.location) ~ "'"] %}
{%- endif %}
{#-
    --authorized is mandatory for --iface; Sensor::performValidation refuses to
    save an enabled sensor without it, so this is belt and braces.
-#}
{%- if node.authorized | default('0', true) | string == '1' %}
{%- set args = args + ['--authorized'] %}
{%- endif %}
{#-
    TLS material.  Only *paths* are emitted; see the file header for how the
    PEM content itself gets to disk.
      listen  mode: --cert/--key are the server identity, --client-ca enforces mTLS
      connect mode: --cert/--key are the client identity, --ca verifies the collector
-#}
{%- if node.client_cert | default('', true) | string | trim != ''
       and node.client_key | default('', true) | string | trim != '' %}
{%- set args = args + ['--cert /usr/local/etc/synapseids/sensor-cert.pem',
                       '--key /usr/local/etc/synapseids/sensor-key.pem'] %}
{%- endif %}
{%- if mode == 'connect' %}
{%- if node.verify_peer | default('1', true) | string == '1' %}
{%- if node.ca | default('', true) | string | trim != '' %}
{%- set args = args + ['--ca /usr/local/etc/synapseids/sensor-ca.pem'] %}
{%- endif %}
{%- else %}
{%- set args = args + ['--insecure-tls'] %}
{%- endif %}
{%- else %}
{%- if node.ca | default('', true) | string | trim != '' %}
{%- set args = args + ['--client-ca /usr/local/etc/synapseids/sensor-ca.pem'] %}
{%- endif %}
{%- endif %}
{#- ------------------------------- output --------------------------------- -#}
{%- if node.enabled | default('0', true) | string == '1' %}
synapseids_sensor_enable="YES"
{% else %}
synapseids_sensor_enable="NO"
{% endif %}
synapseids_sensor_iface="{{ if_dev }}"
synapseids_sensor_iface_id="{{ sh(if_id) }}"
synapseids_sensor_iface_src="{{ if_src }}"
synapseids_sensor_iface_error="{{ if_error }}"
synapseids_sensor_args="{{ args | join(' ') }}"
{% else %}
# The SynapseIDSSensor configuration node does not exist yet.
synapseids_sensor_enable="NO"
synapseids_sensor_iface=""
synapseids_sensor_iface_id=""
synapseids_sensor_iface_src=""
synapseids_sensor_iface_error=""
synapseids_sensor_args=""
{% endif %}
