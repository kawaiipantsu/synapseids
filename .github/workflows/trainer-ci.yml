name: Trainer CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'trainer/**'
      - '.github/workflows/trainer-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'trainer/**'
      - '.github/workflows/trainer-ci.yml'

permissions:
  contents: read

jobs:
  # Fast path: only numpy + pytest. The torch/onnx export test skips itself
  # (pytest.importorskip); everything else must pass.
  tests:
    name: Tests (no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight deps
        run: python -m pip install --upgrade pip "numpy==1.26.*" "pytest>=8.0"
      - name: py_compile
        run: python -m compileall -q trainer/synapse_trainer trainer/tests
      - name: pytest
        run: python -m pytest trainer/ -q

  # Slow path: CPU PyTorch + ONNX wheels, so the ONNX-export tests actually run.
  tests-torch:
    name: Tests (torch + onnx, CPU wheels)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch + trainer deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.2.*"
          python -m pip install "numpy==1.26.*" "onnx==1.16.*" "onnxruntime==1.17.*" \
            "scikit-learn==1.4.*" "pytest>=8.0"
      - name: Install trainer (no deps — already pinned above)
        run: python -m pip install -e trainer/ --no-deps
      - name: pytest
        run: python -m pytest trainer/ -q
