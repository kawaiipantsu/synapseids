name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - run: make deps
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make race

  build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - run: make build-linux
      # The FreeBSD BPF source cannot be exercised on this runner, but it must
      # at least compile and vet — and because bpf_freebsd_assert.go pins every
      # hand-derived ioctl number against syscall.BIOC* with compile-time
      # constant assertions, a successful build here is also a check of those
      # numbers against the FreeBSD ABI (ADR 0014).
      - run: make build-freebsd
      - run: GOOS=freebsd GOARCH=amd64 go vet ./...
      - name: Confirm the fixtures are up to date
        run: |
          go run ./testdata/gen
          git diff --exit-code testdata/pcap || {
            echo "::error::testdata/pcap is stale — run 'make generate' and commit"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      # Build golangci-lint from source with this runner's Go so it does not
      # refuse a go.mod that targets a newer language version than the prebuilt
      # release binary was compiled with.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run ./...

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # The Go pipeline is deliberately Node-free (web/dist is committed and
  # embedded), so nothing above ever runs `vite build`. This job does — in its
  # own runner, gating nothing else — so a toolchain bump (Dependabot keeps
  # proposing Vite majors) cannot pass review untested, and so a hand-edited or
  # stale web/dist is caught (issue #147).
  web-build:
    name: SPA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
        working-directory: web/ui
      - run: npm run typecheck
        working-directory: web/ui
      - run: npm run test
        working-directory: web/ui
      - run: npm run build
        working-directory: web/ui
      - name: Confirm web/dist matches a fresh build
        run: |
          git diff --exit-code web/dist || {
            echo "::error::web/dist is stale — run 'make web' and commit"; exit 1; }
      - name: Confirm the build is deterministic
        run: |
          before=$(find web/dist -type f | sort | xargs sha256sum)
          npm --prefix web/ui run build
          after=$(find web/dist -type f | sort | xargs sha256sum)
          [ "$before" = "$after" ] || {
            echo "::error::two builds of web/ui produced different output"; exit 1; }
