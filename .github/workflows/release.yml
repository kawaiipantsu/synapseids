name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      # "true" only when a signing key is configured, so the sign / apt-repo
      # steps skip cleanly on a fork without the secret.
      HAVE_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Verify the tag matches CHANGELOG
        run: |
          # Strip a leading v and any -rc.N / -beta.N pre-release suffix before
          # comparing to the first dated changelog heading.
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          make_ver="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          echo "tag=$tag base=$base changelog=$make_ver"
          test "$base" = "$make_ver"

      - name: Build archives and packages
        run: |
          make dist
          make deb
          # The OPNsense installer is documented as
          #   curl -fsSL .../releases/download/<tag>/install.sh | sh
          # so it has to BE a release asset. v0.2.0 shipped without it and that
          # documented command returned 404.
          cp contrib/opnsense/install.sh dist/install.sh

      - name: Sign packages and build APT repo
        if: ${{ env.HAVE_GPG == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'pinentry-mode loopback\n'  > "$GNUPGHOME/gpg.conf"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          # Warm-up signature: caches the passphrase in the agent so the
          # signing scripts can then call gpg with no passphrase plumbing.
          printf 'warmup' | gpg --batch --yes --local-user "$key" \
            ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
            --sign --output /dev/null || true
          echo "SYNAPSE_GPG_KEY=$key" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          make deb-sign
          make apt-repo

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes = the changelog section for this release's base version
          # (skips the empty [Unreleased] heading).
          base="${GITHUB_REF_NAME#v}"; base="${base%%-*}"
          notes="$(awk -v v="## [$base]" '
            $0 ~ /^## \[/ { if (ins) exit; if (index($0, v) == 1) { ins=1; next } }
            ins { print }
          ' CHANGELOG.md)"
          [ -n "$notes" ] || notes="See CHANGELOG.md for $GITHUB_REF_NAME."
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # *.asc and the public key exist only when the signing step ran.
          sigs="$(ls dist/*.asc dist/synapseids-signing-key.asc 2>/dev/null || true)"
          gh release create "$GITHUB_REF_NAME" \
            --title "SynapseIDS $GITHUB_REF_NAME" \
            --notes "$notes" \
            $prerelease \
            dist/*.tar.gz dist/*.deb dist/*.pkg dist/SHA256SUMS dist/install.sh $sigs
